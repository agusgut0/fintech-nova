# CI en GitHub Actions: el mismo criterio que el pipeline de GitLab (.gitlab-ci.yml), sin el deploy.
# El deploy a AWS necesita el sandbox de AWS Academy, que solo existe durante una sesión; acá, en su
# lugar, se levanta el stack completo en el runner y se corre el mismo smoke test que verify-deployment.
#
#   lint ──┐
#   secrets ┼──► build-scan (×7 en paralelo) ──► smoke-test (compose up + 6 endpoints + puerto 80)
#   sast ──┘
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: solo lectura del repo. Los jobs que suben SARIF piden security-events aparte.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: aplicaciones-contenedores
  # Riesgos aceptados de Trivy, "imagen:CVE". Cada uno justificado en SEGURIDAD.md §4.3 y §4.4.
  ACCEPTED_CVES: "db:CVE-2025-68121,api-facturas:CVE-2026-47884"

jobs:
  lint:
    name: lint (YAML, Dockerfiles, Compose, shell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: yamllint
        run: |
          pipx install yamllint==1.35.1
          yamllint -d relaxed .gitlab-ci.yml .github/workflows/ "$APP_DIR/docker-compose.yml"

      - name: Hadolint (falla con errores o si el último USER es root)
        run: |
          docker run --rm -v "$PWD:/src" -w /src hadolint/hadolint:v2.12.0-alpine \
            sh -c 'hadolint --failure-threshold error --error DL3002 $(find aplicaciones-contenedores -name Dockerfile | sort)'

      - name: ShellCheck
        run: shellcheck --severity warning $(find . -name '*.sh' -not -path './.git/*' | sort)

      - name: Compose contra el esquema y las reglas del proyecto
        working-directory: ${{ env.APP_DIR }}
        run: |
          for s in db api-clientes api-pagos api-facturas api-transacciones api-tarjetas; do cp "$s/env.example" "$s/.env"; done
          docker compose config --quiet
          docker compose config --format json > /tmp/compose.json
          jq -r '.services | to_entries[] |
            (select(.value.restart != "always") | "\(.key): falta restart: always"),
            (select(.value.deploy.resources.limits.cpus == null or .value.deploy.resources.limits.memory == null)
              | "\(.key): faltan limites de CPU o memoria"),
            (select(.key != "web" and ((.value.ports // []) | length) > 0) | "\(.key): publica puertos (solo web puede)"),
            (select(.key == "web") | .value.ports[]? | select(.published != "8443")
              | "web: publica el puerto \(.published) (solo se permite 8443)"),
            (select((.value.cap_drop // []) | index("ALL") | not) | "\(.key): falta cap_drop: [ALL]"),
            (select((.value.security_opt // []) | index("no-new-privileges:true") | not)
              | "\(.key): falta no-new-privileges"),
            (select(.value.read_only != true) | "\(.key): falta read_only: true"),
            (select(.value.logging.options["max-size"] == null) | "\(.key): falta rotacion de logs")
          ' /tmp/compose.json > /tmp/incumplidas.txt
          if [ -s /tmp/incumplidas.txt ]; then cat /tmp/incumplidas.txt; exit 1; fi
          echo "OK: solo web publica 8443; restart, límites, hardening y rotación de logs en los 7 servicios."

      - name: Terraform fmt y validate
        working-directory: infra
        run: |
          docker run --rm -v "$PWD:/infra" -w /infra hashicorp/terraform:1.17.2 fmt -check -recursive
          docker run --rm -v "$PWD:/infra" -w /infra hashicorp/terraform:1.17.2 init -backend=false -input=false
          docker run --rm -v "$PWD:/infra" -w /infra hashicorp/terraform:1.17.2 validate

  secrets:
    name: secret-scan (Gitleaks, todo el historial)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # todo el historial, no solo el último commit
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            detect --source . --log-opts="--all" --redact --verbose --exit-code 1

  sast:
    name: sast (Semgrep)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # para publicar los hallazgos en la pestaña Security del repo
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (reporte completo + corte solo con severidad ERROR)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.99.0 \
            semgrep scan --config p/default --metrics off --quiet --sarif-output=semgrep.sarif . || true
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.99.0 \
            semgrep scan --config p/default --metrics off --severity ERROR --error --quiet .
      - name: Publicar SARIF en GitHub Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  build-scan:
    name: build + Trivy (${{ matrix.service }})
    needs: [lint, secrets, sast]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false   # que un servicio con CVEs no oculte el resultado de los demás
      matrix:
        service: [db, api-clientes, api-pagos, api-facturas, api-transacciones, api-tarjetas, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --pull --tag "fintech-nova/${{ matrix.service }}:${{ github.sha }}" "$APP_DIR/${{ matrix.service }}"

      - name: Riesgos aceptados de esta imagen
        run: |
          (echo "$ACCEPTED_CVES" | tr ',' '\n' | tr -d ' ' | grep "^${{ matrix.service }}:" | cut -d: -f2 > .trivyignore) || true
          echo "Excepciones para ${{ matrix.service }}:"; cat .trivyignore

      - name: Trivy (un solo escaneo; corta con CRITICAL que tiene parche)
        run: |
          IMAGE="fintech-nova/${{ matrix.service }}:${{ github.sha }}"
          TRIVY="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/work -w /work aquasec/trivy:0.58.2"
          $TRIVY image --image-src docker --ignore-unfixed --format json --output trivy.json "$IMAGE"
          $TRIVY convert --format table trivy.json
          $TRIVY convert --format sarif --output trivy.sarif trivy.json
          $TRIVY convert --format table --severity CRITICAL --exit-code 1 trivy.json

      - name: Publicar SARIF en GitHub Code Scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}

  smoke-test:
    name: smoke test (stack completo con Docker Compose)
    needs: build-scan
    runs-on: ubuntu-24.04
    env:
      # Las imágenes se construyen en este runner; el compose las toma por estas dos variables,
      # igual que en la EC2 (allí apuntan a Docker Hub y al SHA del commit).
      REGISTRY_IMAGE: fintech-nova
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build de las 7 imágenes
        run: |
          for s in db api-clientes api-pagos api-facturas api-transacciones api-tarjetas web; do
            docker build --tag "$REGISTRY_IMAGE/$s:$IMAGE_TAG" "$APP_DIR/$s" &
          done
          wait

      - name: .env con contraseñas aleatorias y certificado autofirmado
        working-directory: ${{ env.APP_DIR }}
        run: |
          sh generar-env.sh
          mkdir -p certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout certs/key.pem -out certs/cert.pem -subj "/CN=localhost"
          chmod 644 certs/*.pem

      - name: docker compose up
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose up -d --wait --wait-timeout 300
          docker compose ps

      - name: 6 endpoints en HTTP 200 y puerto 80 cerrado (igual que verify-deployment)
        run: |
          set -eu
          for ep in / /api/clientes /api/pagos /api/facturas /api/transacciones /api/tarjetas; do
            status="$(curl --insecure --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --retry 10 --retry-delay 5 --retry-connrefused "https://localhost:8443$ep")"
            echo "$ep -> HTTP $status"
            test "$status" = "200"
          done
          if curl --silent --max-time 5 --output /dev/null "http://localhost:80/"; then
            echo "ERROR: el puerto 80 responde y debería estar cerrado"; exit 1
          fi
          echo "Puerto 80 cerrado -> OK"

      - name: Logs si algo falló
        if: failure()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose logs --tail=100
