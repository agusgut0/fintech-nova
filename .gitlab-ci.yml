stages:
  - validate
  - build
  - security
  - publish
  - infra
  - deploy
  - verify

variables:
  ALUMNO: devops-grupo6
  APP_DIR: "aplicaciones-contenedores"
  IMAGE_TAG: "$CI_COMMIT_SHA"
  DOCKER_HOST: ""
  DOCKER_TLS_CERTDIR: ""
  DOCKER_TLS_VERIFY: ""
  DOCKER_CERT_PATH: ""
  RUNNER_TAG: runner-without-dind
  REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH"
  # Cuenta de Docker Hub donde se publican las imagenes aprobadas. No es un secreto (es publica):
  # los tokens van como variables de CI/CD enmascaradas y protegidas (DOCKERHUB_*_TOKEN).
  DOCKERHUB_NAMESPACE: devopsgrupo6
  # Terraform: carpeta de la infraestructura y nombre del estado guardado en GitLab
  TF_ROOT: infra
  TF_STATE_NAME: production
  # Riesgos aceptados de Trivy. Formato: "imagen:CVE", separados por coma. Cada entrada aplica
  # SOLO a esa imagen. Cada una debe estar justificada en SEGURIDAD.md (secciones 4.3 y 4.4).
  #  - db:CVE-2025-68121           gosu (binario Go de la imagen oficial de MariaDB) no usa TLS. Revisar: 2026-12-15.
  #  - api-facturas:CVE-2026-47884 spring-webmvc: la correccion solo existe en la version 7.x (cambio
  #                                mayor de Spring Boot) y la API no usa vistas XSLT. Revisar: 2026-12-15.
  ACCEPTED_CVES: "db:CVE-2025-68121,api-facturas:CVE-2026-47884"

yaml-lint:
  stage: validate
  tags: [$RUNNER_TAG]
  image: python:3.12-alpine
  script:
    - pip install --no-cache-dir yamllint==1.35.1
    - yamllint -d relaxed .gitlab-ci.yml "$APP_DIR/docker-compose.yml"

dockerfile-lint:
  # Revisa las buenas practicas de TODOS los Dockerfiles (usuario no-root, WORKDIR, etc.).
  # Corre en "validate": falla rapido, sin esperar al build.
  stage: validate
  tags: [$RUNNER_TAG]
  image:
    name: hadolint/hadolint:v2.12.0-alpine
    entrypoint: [""]
  script:
    - find "$APP_DIR" -name Dockerfile | sort > dockerfiles.txt
    - cat dockerfiles.txt
    - test -s dockerfiles.txt
    # Paso 1: genera el reporte completo (todas las severidades). Nunca corta.
    - hadolint --format json $(cat dockerfiles.txt) > hadolint-report.json || true
    # Paso 2: la regla de corte. Falla solo con errores, y se eleva a error la regla
    # DL3002 ("el ultimo USER no debe ser root").
    - hadolint --failure-threshold error --error DL3002 $(cat dockerfiles.txt)
  artifacts:
    when: always            # guarda el reporte aunque el job falle
    expire_in: 30 days
    paths:
      - hadolint-report.json
      - dockerfiles.txt

# Base comun de los jobs de Terraform (los jobs la reutilizan con "extends")
.terraform-base:
  tags: [$RUNNER_TAG]
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]

terraform-validate:
  # Revisa formato y sintaxis de la infraestructura en todas las ramas, sin credenciales
  # de AWS y sin tocar el estado (-backend=false). Falla rapido, antes del build.
  stage: validate
  extends: .terraform-base
  script:
    - cd "$TF_ROOT"
    - terraform fmt -check -recursive -diff
    - terraform init -backend=false -input=false
    - terraform validate

secret-scan:
  # Busca contrasenas, claves y tokens en todo el repositorio, incluido el historial.
  stage: security
  needs: []                 # no espera al build: arranca apenas empieza el pipeline
  tags: [$RUNNER_TAG]
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0            # descarga TODO el historial (por defecto GitLab baja solo los ultimos commits)
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # --redact: el reporte no muestra el valor del secreto encontrado
    - gitleaks detect --source . --log-opts="--all" --redact --verbose --exit-code 1 --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gitleaks-report.json

sast:
  # Analisis estatico: lee el codigo fuente buscando patrones de vulnerabilidad.
  stage: security
  needs: []
  tags: [$RUNNER_TAG]
  image:
    name: semgrep/semgrep:1.99.0
    entrypoint: [""]
  script:
    # Paso 1: reporte completo con todas las severidades. Nunca corta.
    - semgrep scan --config p/default --metrics off --quiet --json-output=semgrep-report.json --sarif-output=semgrep-report.sarif . || true
    # Paso 2: la regla de corte. Falla solo con severidad ERROR.
    - semgrep scan --config p/default --metrics off --severity ERROR --error --quiet .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - semgrep-report.json
      - semgrep-report.sarif

dependency-scan:
  # Revisa las librerias declaradas (requirements.txt, package-lock.json, go.sum, pom.xml)
  # y la configuracion de los Dockerfiles. Solo informa: el job queda naranja si encuentra algo.
  stage: security
  needs: []
  tags: [$RUNNER_TAG]
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  allow_failure: true
  variables:
    TRIVY_CACHE_DIR: ".trivycache"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    # Riesgos aceptados para dependencias (entradas "dependencias:CVE")
    - |
      (echo "$ACCEPTED_CVES" | tr ',' '\n' | tr -d ' ' | grep "^dependencias:" | cut -d: -f2 > .trivyignore) || true
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format json --output trivy-fs-report.json .
    - trivy convert --format table --output trivy-fs-report.txt trivy-fs-report.json
    - cat trivy-fs-report.txt
    # Esta linea hace que el job quede naranja si hay HIGH/CRITICAL con parche disponible
    - trivy fs --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-fs-report.json
      - trivy-fs-report.txt

build-image:
  stage: build
  tags: [$RUNNER_TAG]
  image: docker:27.5.1-cli
  services:
    - name: docker:dind
      command: ["--tls=false"]
  parallel:
    matrix:
      - SERVICE:
          - db
          - api-clientes
          - api-pagos
          - api-facturas
          - api-transacciones
          - api-tarjetas
          - web
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull --tag "$REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG-candidate" "$APP_DIR/$SERVICE"
    - docker push "$REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG-candidate"

image-scan:
  # Busca vulnerabilidades conocidas (CVEs) dentro de cada imagen construida.
  # Son 7 jobs, uno por servicio, y corren todos a la vez (parallel: matrix).
  # Por defecto espera a que termine todo el stage "build", porque escanea la imagen
  # candidata que ese stage subio al registry.
  stage: security
  tags: [$RUNNER_TAG]
  retry:
    max: 2
    when:
      - script_failure
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  parallel:
    matrix:
      - SERVICE:
          - db
          - api-clientes
          - api-pagos
          - api-facturas
          - api-transacciones
          - api-tarjetas
          - web
  variables:
    # Trivy ya no se conecta al registry (ver --image-src docker abajo): no necesita credenciales
    TRIVY_CACHE_DIR: ".trivycache"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_TIMEOUT: "10m"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    # Confianza en el certificado del registry SIN desactivar la verificacion de TLS.
    # Algunos runners no reconocen la CA del registry del labsys (error "x509: certificate signed by
    # unknown authority"). Se arma una lista de CAs de confianza = las del sistema + la del registry,
    # que se carga en la variable de CI/CD REGISTRY_CA_CERT (tipo File). Si la variable no existe,
    # el job sigue funcionando con las CAs del sistema.
    - cat /etc/ssl/certs/ca-certificates.crt > /tmp/ca-bundle.crt
    - |
      for ca in "$REGISTRY_CA_CERT" "$CI_SERVER_TLS_CA_FILE"; do
        if [ -n "$ca" ] && [ -f "$ca" ]; then cat "$ca" >> /tmp/ca-bundle.crt; echo "CA adicional cargada"; fi
      done
    - export SSL_CERT_FILE=/tmp/ca-bundle.crt
    - export IMAGE="$REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG-candidate"
    - echo "Escaneando $IMAGE"
    # Riesgos aceptados de ESTA imagen (variable ACCEPTED_CVES arriba): Trivy los ignora
    - |
      (echo "$ACCEPTED_CVES" | tr ',' '\n' | tr -d ' ' | grep "^$SERVICE:" | cut -d: -f2 > .trivyignore) || true
      echo "Excepciones aplicadas a $SERVICE:"
      cat .trivyignore
    # Cliente de Docker: la imagen de Trivy no lo trae. Se usa el Docker del runner (socket montado,
    # el mismo que usa build-image), que SI confia en el certificado del registry del labsys.
    - apk add --no-cache docker-cli
    # La descarga la hace el Docker del runner y Trivy lee la imagen desde ahi (--image-src docker).
    # Antes Trivy la bajaba por su cuenta y fallaba con "x509: certificate signed by unknown
    # authority"; solo pasaba cuando la imagen ya estaba en el Docker local (ERRORES.md, error 42).
    # El trap cierra la sesion y borra la imagen SIEMPRE, aunque el escaneo falle: no queda la
    # credencial guardada ni la imagen ocupando el disco del runner (ERRORES.md, error 40).
    # UNICO escaneo de la imagen. Genera el reporte en JSON con todas las severidades que tienen
    # parche. Nunca corta (exit-code 0 por defecto).
    - |
      trap 'docker rmi "$IMAGE" >/dev/null 2>&1 || true; docker logout "$CI_REGISTRY" >/dev/null 2>&1 || true' EXIT
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
      docker pull "$IMAGE"
      trivy image --image-src docker --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --ignore-unfixed --format json --output "trivy-$SERVICE.json" "$IMAGE"
    # Todo lo que sigue trabaja sobre el JSON local: no vuelve a tocar el registry ni la base de datos.
    - trivy convert --format table --output "trivy-$SERVICE.txt" "trivy-$SERVICE.json"
    - cat "trivy-$SERVICE.txt"
    # La regla de corte: falla solo con CRITICAL que ya tiene parche (el JSON ya excluye los que no lo tienen).
    # Aplica tambien .trivyignore, igual que el escaneo.
    - trivy convert --format table --severity CRITICAL --exit-code 1 "trivy-$SERVICE.json"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - "trivy-$SERVICE.json"
      - "trivy-$SERVICE.txt"

publish-image:
  stage: publish
  tags: [$RUNNER_TAG]
  image: docker:27.5.1-cli
  services:
    - name: docker:dind
      alias: docker
  parallel:
    matrix:
      - SERVICE:
          - db
          - api-clientes
          - api-pagos
          - api-facturas
          - api-transacciones
          - api-tarjetas
          - web
  script:
    # Re-etiqueta la imagen aprobada en el registry interno del labsys (como antes)
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG-candidate"
    - docker tag "$REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG-candidate" "$REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG"
    - docker push "$REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG"
    # Publica en Docker Hub SOLO la imagen que paso el stage security. La EC2 no llega al
    # registry del labsys (solo existe dentro de la red de la facultad), por eso se usa Docker Hub.
    # Solo en la rama default: el token es una variable protegida y no existe en otras ramas.
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        echo "Rama $CI_COMMIT_BRANCH: no se publica en Docker Hub"; exit 0
      fi
      echo "$DOCKERHUB_PUSH_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin
      docker tag "$REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG-candidate" "$DOCKERHUB_NAMESPACE/$SERVICE:$IMAGE_TAG"
      docker push "$DOCKERHUB_NAMESPACE/$SERVICE:$IMAGE_TAG"
      docker logout

# Configuracion comun de infra-apply e infra-destroy
.terraform-aws:
  extends: .terraform-base
  # Un solo job a la vez sobre la infraestructura y el despliegue de produccion
  resource_group: production
  variables:
    AWS_DEFAULT_REGION: us-east-1
    # Backend "http" de GitLab: el estado vive en Operate > Terraform states.
    # Se autentica con el token del job, que vence al terminar el job (sin credenciales extra).
    TF_HTTP_ADDRESS: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/$TF_STATE_NAME"
    TF_HTTP_LOCK_ADDRESS: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/$TF_STATE_NAME/lock"
    TF_HTTP_UNLOCK_ADDRESS: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/$TF_STATE_NAME/lock"
    TF_HTTP_LOCK_METHOD: POST
    TF_HTTP_UNLOCK_METHOD: DELETE
    TF_HTTP_USERNAME: gitlab-ci-token
    TF_HTTP_PASSWORD: "$CI_JOB_TOKEN"
    TF_HTTP_RETRY_WAIT_MIN: "5"
  # No usa los reportes de los jobs anteriores
  dependencies: []
  before_script:
    # Credenciales del sandbox: cambian en cada sesion (AWS Details > AWS CLI)
    - |
      : "${AWS_ACCESS_KEY_ID:?Define AWS_ACCESS_KEY_ID (se actualiza en cada sesion del sandbox)}"
      : "${AWS_SECRET_ACCESS_KEY:?Define AWS_SECRET_ACCESS_KEY (se actualiza en cada sesion del sandbox)}"
      : "${AWS_SESSION_TOKEN:?Define AWS_SESSION_TOKEN (se actualiza en cada sesion del sandbox)}"
    - cd "$TF_ROOT"
    - terraform init -input=false

infra-apply:
  # Crea (o actualiza) en el sandbox el Security Group, la llave SSH y la EC2.
  # Es el boton de despliegue: MANUAL, porque el sandbox esta apagado casi siempre.
  # Mientras nadie lo ejecute, el pipeline queda en verde (allow_failure: true).
  # Si la infraestructura ya existe en esta sesion, Terraform no crea nada nuevo.
  stage: infra
  extends: .terraform-aws
  environment:
    name: production
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - |
      set -eu
      apk add --no-cache aws-cli curl >/dev/null

      # El puerto 22 se abre SOLO para la IP con la que sale este runner a internet
      RUNNER_IP="$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
      echo "IP de salida del runner: $RUNNER_IP"
      export TF_VAR_runner_cidr="$RUNNER_IP/32"

      terraform apply -input=false -auto-approve

      EC2_IP="$(terraform output -raw public_ip)"
      INSTANCE_ID="$(terraform output -raw instance_id)"
      echo "Instancia $INSTANCE_ID con IP $EC2_IP"

      # Identidad de la EC2: la clave publica del host se lee del registro del sistema
      # de la instancia por la API de AWS (canal autenticado), no de la red. Asi deploy
      # se conecta con StrictHostKeyChecking=yes sin confiar a ciegas en la primera conexion.
      # El registro tarda unos minutos en tener las claves despues del arranque.
      HOST_KEY=""
      for intento in $(seq 1 30); do
        HOST_KEY="$(aws ec2 get-console-output --instance-id "$INSTANCE_ID" --latest \
            --query Output --output text 2>/dev/null | tr -d '\r' \
          | sed -n '/-----BEGIN SSH HOST KEY KEYS-----/,/-----END SSH HOST KEY KEYS-----/p' \
          | awk '$1 == "ssh-ed25519" { print $1 " " $2; exit }')" || true
        [ -n "$HOST_KEY" ] && break
        echo "Esperando la clave del host ($intento/30)..."
        sleep 10
      done
      if [ -z "$HOST_KEY" ]; then
        echo "ERROR: no se encontro la clave ssh-ed25519 en el registro del sistema"; exit 1
      fi
      echo "Clave del host: $HOST_KEY"

      # Datos para deploy y verify-deployment: la IP como variable (dotenv) y el known_hosts
      # como archivo. Se llama INFRA_EC2_HOST y no EC2_HOST porque una variable de proyecto
      # con el mismo nombre tendria prioridad sobre la del dotenv.
      echo "$EC2_IP $HOST_KEY" > "$CI_PROJECT_DIR/known_hosts"
      echo "INFRA_EC2_HOST=$EC2_IP" > "$CI_PROJECT_DIR/infra.env"
  artifacts:
    expire_in: 1 day
    paths:
      - known_hosts
    reports:
      dotenv: infra.env

infra-destroy:
  # Borra todo lo que creo Terraform. Opcional: el sandbox tambien lo borra al cerrarse.
  stage: infra
  extends: .terraform-aws
  environment:
    name: production
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    # runner_cidr es obligatoria, pero para destruir no importa su valor
    - terraform destroy -input=false -auto-approve -var "runner_cidr=127.0.0.1/32"

deploy:
  stage: deploy
  image: alpine:3.21
  # Recibe de infra-apply la IP (INFRA_EC2_HOST) y el archivo known_hosts
  needs:
    - job: infra-apply
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client
  script:
    - |
      set -eu
      : "${INFRA_EC2_HOST:?No llego INFRA_EC2_HOST desde infra-apply}"
      test -s known_hosts || { echo "No llego known_hosts desde infra-apply"; exit 1; }
      : "${EC2_SSH_PRIVATE_KEY:?Define EC2_SSH_PRIVATE_KEY como variable de tipo archivo}"
      # Credenciales de Docker Hub de SOLO LECTURA (la EC2 solo baja imagenes, nunca sube)
      : "${DOCKERHUB_USER:?Define DOCKERHUB_USER en las variables CI/CD}"
      : "${DOCKERHUB_PULL_TOKEN:?Define DOCKERHUB_PULL_TOKEN (token de solo lectura)}"
      : "${DB_ENV_FILE:?Define DB_ENV_FILE como variable de tipo archivo}"
      : "${API_CLIENTES_ENV_FILE:?Define API_CLIENTES_ENV_FILE como variable de tipo archivo}"
      : "${API_PAGOS_ENV_FILE:?Define API_PAGOS_ENV_FILE como variable de tipo archivo}"
      : "${API_FACTURAS_ENV_FILE:?Define API_FACTURAS_ENV_FILE como variable de tipo archivo}"
      : "${API_TRANSACCIONES_ENV_FILE:?Define API_TRANSACCIONES_ENV_FILE como variable de tipo archivo}"
      : "${API_TARJETAS_ENV_FILE:?Define API_TARJETAS_ENV_FILE como variable de tipo archivo}"

      chmod 600 "$EC2_SSH_PRIVATE_KEY"
      SSH_OPTS="-i $EC2_SSH_PRIVATE_KEY -o UserKnownHostsFile=$CI_PROJECT_DIR/known_hosts -o StrictHostKeyChecking=yes"
      REMOTE="ec2-user@$INFRA_EC2_HOST"
      REMOTE_DIR="/home/ec2-user/$APP_DIR"

      ssh $SSH_OPTS "$REMOTE" '
        set -eu
        if ! command -v docker >/dev/null 2>&1; then
          sudo dnf install -y docker openssl
          sudo systemctl enable --now docker
          sudo usermod -aG docker ec2-user
        fi
        sudo systemctl enable --now docker
        # Plugin de Compose en version FIJA (la misma probada localmente) en vez de "latest",
        # que cambia sin aviso. Se instala si falta o si la version instalada es otra.
        COMPOSE_VERSION=v5.5.1
        if [ "$(sudo docker compose version --short 2>/dev/null)" != "${COMPOSE_VERSION#v}" ]; then
          ARCH=$(uname -m)
          cd /tmp
          curl -fsSLO "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-$ARCH"
          curl -fsSLO "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-$ARCH.sha256"
          # Verifica que el binario no fue alterado antes de instalarlo con sudo
          sha256sum -c "docker-compose-linux-$ARCH.sha256"
          sudo mkdir -p /usr/libexec/docker/cli-plugins
          sudo install -m 755 "docker-compose-linux-$ARCH" /usr/libexec/docker/cli-plugins/docker-compose
          rm -f "docker-compose-linux-$ARCH" "docker-compose-linux-$ARCH.sha256"
          cd - >/dev/null
        fi
        mkdir -p "'"$REMOTE_DIR"'/db" "'"$REMOTE_DIR"'/api-clientes" \
          "'"$REMOTE_DIR"'/api-pagos" "'"$REMOTE_DIR"'/api-facturas" \
          "'"$REMOTE_DIR"'/api-transacciones" "'"$REMOTE_DIR"'/api-tarjetas" \
          "'"$REMOTE_DIR"'/certs"
      '

      scp $SSH_OPTS "$APP_DIR/docker-compose.yml" "$REMOTE:$REMOTE_DIR/docker-compose.yml"
      scp $SSH_OPTS "$DB_ENV_FILE" "$REMOTE:$REMOTE_DIR/db/.env"
      scp $SSH_OPTS "$API_CLIENTES_ENV_FILE" "$REMOTE:$REMOTE_DIR/api-clientes/.env"
      scp $SSH_OPTS "$API_PAGOS_ENV_FILE" "$REMOTE:$REMOTE_DIR/api-pagos/.env"
      scp $SSH_OPTS "$API_FACTURAS_ENV_FILE" "$REMOTE:$REMOTE_DIR/api-facturas/.env"
      scp $SSH_OPTS "$API_TRANSACCIONES_ENV_FILE" "$REMOTE:$REMOTE_DIR/api-transacciones/.env"
      scp $SSH_OPTS "$API_TARJETAS_ENV_FILE" "$REMOTE:$REMOTE_DIR/api-tarjetas/.env"
      # La EC2 baja las imagenes de Docker Hub, no del registry del labsys
      printf 'REGISTRY_IMAGE=%s\nIMAGE_TAG=%s\n' "$DOCKERHUB_NAMESPACE" "$IMAGE_TAG" > deploy.env
      scp $SSH_OPTS deploy.env "$REMOTE:$REMOTE_DIR/.env"
      rm -f deploy.env

      # Login, pull y up en UNA sola sesion SSH. El token entra por stdin (no queda en el
      # historial ni en el log). El trap hace el logout aunque el pull o el up fallen,
      # para no dejar la credencial guardada en la EC2.
      printf '%s' "$DOCKERHUB_PULL_TOKEN" | ssh $SSH_OPTS "$REMOTE" "
        set -eu
        trap 'sudo docker logout >/dev/null 2>&1 || true' EXIT
        sudo docker login --username '$DOCKERHUB_USER' --password-stdin
        cd '$REMOTE_DIR'
        if [ ! -f certs/cert.pem ] || [ ! -f certs/key.pem ]; then
          sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout certs/key.pem -out certs/cert.pem -subj '/CN=$INFRA_EC2_HOST'
          sudo chmod 644 certs/key.pem certs/cert.pem
          sudo chown ec2-user:ec2-user certs/cert.pem certs/key.pem
        fi
        # Quita los CRLF de Windows: con un \r al final las variables quedan mal y la DB no arranca
        sed -i 's/\r$//' db/.env api-*/.env
        sudo chmod 600 db/.env api-*/.env .env
        sudo docker compose pull
        sudo docker compose up -d
        sudo docker compose ps
      "
  environment:
    name: production
    # Link a la app en Operate > Environments (boton "Open")
    url: https://$INFRA_EC2_HOST:8443
  resource_group: production
  tags: [$RUNNER_TAG]
  rules:
    # Corre solo despues de infra-apply (que es el job manual que se aprieta)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify-deployment:
  stage: verify
  image: curlimages/curl:8.12.1
  tags: [$RUNNER_TAG]
  script:
    - |
      set -eu
      : "${INFRA_EC2_HOST:?No llego INFRA_EC2_HOST desde infra-apply}"
      for endpoint in / /api/clientes /api/pagos /api/facturas /api/transacciones /api/tarjetas; do
        status="$(curl --insecure --silent --show-error --output /dev/null --write-out '%{http_code}' \
          --retry 10 --retry-delay 5 --retry-connrefused "https://$INFRA_EC2_HOST:8443$endpoint")"
        echo "$endpoint -> HTTP $status"
        test "$status" = "200"
      done
      # El 80 debe estar cerrado: si responde algo (cualquier codigo HTTP), el job falla
      if curl --silent --max-time 5 --output /dev/null "http://$INFRA_EC2_HOST:80/"; then
        echo "ERROR: el puerto 80 responde y deberia estar cerrado"; exit 1
      fi
      echo "Puerto 80 cerrado -> OK"
  # La IP llega desde infra-apply; de deploy solo se espera que termine bien
  needs:
    - job: infra-apply
      artifacts: true
    - job: deploy
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
