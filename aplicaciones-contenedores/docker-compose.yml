services:
  db:
    image: fabripeveraro/db:1.0.0
    container_name: dbPrincipal
    env_file:
      - db/.env
    networks:
      - fintech_net
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  api-clientes:
    image: fabripeveraro/api-clientes:1.0.0
    container_name: api_clientes
    env_file:
      - api-clientes/.env
    networks:
      - fintech_net
    depends_on:
      - db
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M

volumes:
  db_data:

networks:
  fintech_net:
    driver: bridge
