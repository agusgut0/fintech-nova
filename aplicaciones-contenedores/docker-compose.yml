services:
  db:
    image: fabripeveraro/db:1.0.1
    container_name: dbPrincipal
    env_file:
      - db/.env
    networks:
      - fintech_net
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  api-clientes:
    image: fabripeveraro/api-clientes:1.0.0
    container_name: api_clientes
    env_file:
      - api-clientes/.env
    networks:
      - fintech_net
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
  api-transacciones:
    image: 89768/api-transacciones:1.0.0
    container_name: api-transacciones
    env_file:
      - api-transacciones/.env
    networks:
      - fintech_net
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
  api-facturas:
    image: 89768/api-facturas:1.0.0
    container_name: api-facturas
    env_file:
      - api-facturas/.env
    networks:
      - fintech_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget --spider -q http://127.0.0.1:8080/facturas || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 7s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 256M
  api-tarjetas:
    image: ezequielmartellotto/api-tarjetas:1.0.0
    container_name: api_tarjetas
    env_file:
      - api-tarjetas/.env
    networks:
      - fintech_net
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
  api-pagos:
    image: jhorsi/api-pagos:1.0.0
    container_name: api-pagos
    init: true
    env_file:
      - api-pagos/.env
    networks:
      - fintech_net
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
  web:
    image: 89768/web:1.0.0
    container_name: web
    ports:
      - "8443:8443"
    networks:
      - fintech_net
    depends_on:
      api-tarjetas:
        condition: service_started
      api-pagos:
        condition: service_started
      api-clientes:
        condition: service_started
      api-transacciones:
        condition: service_started
      api-facturas:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    volumes:
      - ./certs:/etc/nginx/certs:ro
volumes:
  db_data:

networks:
  fintech_net:
    driver: bridge
