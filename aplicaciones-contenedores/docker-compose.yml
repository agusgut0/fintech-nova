services:
  db:
    image: fabripeveraro/db:1.0.0
    container_name: dbPrincipal
    env_file:
      - db/.env
    networks:
      - fintech_net
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  api-clientes:
    image: fabripeveraro/api-clientes:1.0.0
    container_name: api_clientes
    env_file:
      - api-clientes/.env
    networks:
      - fintech_net
    depends_on:
      - db
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
  api-transacciones:
    image: 89768/api-transacciones:1.0.0
    container_name: api-transacciones
    env_file:
      - api-transacciones/.env
    networks:
      - fintech_net
    depends_on:
      - db
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
  api-facturas:
    image: 89768/api-facturas:1.0.0
    container_name: api-facturas
    env_file:
      - api-facturas/.env
    networks:
      - fintech_net
    depends_on:
      - db
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
  api-tarjetas:
    image: ezequielmartellotto/api-tarjetas:1.0.0
    container_name: api_tarjetas
    env_file:
      - api-tarjetas/.env
    networks:
      - fintech_net
    depends_on:
      - db
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
  api-pagos:
    image: jhorsi/api-pagos:1.0.0
    container_name: api-pagos
    init: true
    env_file:
      - api-pagos/.env
    networks:
      - fintech_net
    depends_on:
      - db
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
volumes:
  db_data:

networks:
  fintech_net:
    driver: bridge
