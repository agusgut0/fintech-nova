# Limite de peticiones a las APIs: 10 por segundo por IP de origen (zona de 10 MB en memoria,
# alcanza para ~160.000 IPs). Frena fuerza bruta y abuso sin afectar el uso normal del panel.
# Va fuera del bloque "server" porque este archivo se incluye dentro del contexto "http".
limit_req_zone $binary_remote_addr zone=api_por_ip:10m rate=10r/s;

server {
    server_tokens off;
    listen       8443 ssl;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Solo versiones de TLS sin vulnerabilidades conocidas (TLS 1.0 y 1.1 estan deprecadas)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Headers de seguridad en todas las respuestas ("always": tambien en las de error)
    # HSTS: el navegador usa siempre HTTPS con este sitio
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Impide que el navegador "adivine" el tipo de contenido de una respuesta
    add_header X-Content-Type-Options "nosniff" always;
    # Impide que otro sitio muestre el panel dentro de un iframe (clickjacking)
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # El panel solo carga scripts, estilos y datos del propio sitio
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    resolver 127.0.0.11 valid=30s;

    # Headers que reciben las APIs (se heredan en todos los "location" con proxy_pass)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Respuesta cuando se supera el limite de peticiones: 429 Too Many Requests
    limit_req_status 429;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    # Cada /api/<servicio> se reenvia al contenedor de ESE microservicio. Los nombres de
    # upstream (api-clientes, api-pagos, etc.) tienen que coincidir con el nombre del servicio
    # en el docker-compose.yml. "burst" absorbe rafagas cortas (por ejemplo, al cargar el panel).
    location /api/clientes {
        limit_req zone=api_por_ip burst=20 nodelay;
        set $upstream api-clientes:8080;
        rewrite ^/api/clientes(.*)$ /clientes$1 break;
        proxy_pass http://$upstream;
    }

    location /api/pagos {
        limit_req zone=api_por_ip burst=20 nodelay;
        set $upstream api-pagos:8080;
        rewrite ^/api/pagos(.*)$ /pagos$1 break;
        proxy_pass http://$upstream;
    }

    location /api/facturas {
        limit_req zone=api_por_ip burst=20 nodelay;
        set $upstream api-facturas:8080;
        rewrite ^/api/facturas(.*)$ /facturas$1 break;
        proxy_pass http://$upstream;
    }

    location /api/transacciones {
        limit_req zone=api_por_ip burst=20 nodelay;
        set $upstream api-transacciones:8080;
        rewrite ^/api/transacciones(.*)$ /transacciones$1 break;
        proxy_pass http://$upstream;
    }

    location /api/tarjetas {
        limit_req zone=api_por_ip burst=20 nodelay;
        set $upstream api-tarjetas:8080;
        rewrite ^/api/tarjetas(.*)$ /tarjetas$1 break;
        proxy_pass http://$upstream;
    }
}
